name: Discourse Theme

on:
  push:
    branches:
      - main
  pull_request:
  # The docs sidebar patch depends on internals of discourse-doc-categories,
  # which CI installs from its main branch. A weekly run surfaces upstream
  # changes that would otherwise only show up on the next push.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  ci:
    uses: discourse/.github/.github/workflows/discourse-theme.yml@v1
    with:
      # Pinned to stable: core main opens a libvips unix socket under
      # Rails.root/tmp, and in Actions the checkout path repeats the repo
      # name, so the socket path exceeds the 108-byte limit and db:migrate
      # dies. Drop this back to the default "latest" once core moves that
      # socket out of the working directory.
      core_ref: stable
